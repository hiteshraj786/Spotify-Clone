<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/utility.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1DB954">
  <title>Spotify - Web Player: Music for everyone </title>
</head>

<body>
  <!-- <img src="logo.svg" alt="spotify logo"> -->

  <div class="container flex bg-black">
    <div class="left">
      <div class="close invert">
        <img width="30px" src="img/close.svg" alt="Close" />
      </div>

      <div class="home bg-grey rounded m-1 p-1">
        <div class="log">
          <img class="invert" src="img/logo.svg" alt="Spotify Logo" />
        </div>
        <ul>
          <li><img class="invert" src="img/home.svg" alt="Home" />Home</li>
          <li id="installBtn" style="display:none;"><img class="invert" src="img/download.svg" alt="Install" />Install App</li>
        </ul>
      </div>
      <div class="library bg-grey rounded m-1 p-1">
        <div class="heading">
          <img class="invert" src="img/playlist.svg" alt="Playlist" />

          <h4>Your Library</h4>
        </div>
        <div class="songList">
          <ul>

          </ul>
        </div>

        <div class="footer">
          <div>
            <a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a>
          </div>
          <div>
            <a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a>
          </div>
          <div>
            <a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
          </div>
          <div>
            <a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a>
          </div>
          <div>
            <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a>
          </div>
          <div>
            <a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a>
          </div>
        </div>
      </div>
    </div>
    <div class="right border bg-grey rounded">
      <div class="header">


        <div class="nav">
          <img class="invert hameBurger" src="img/hameburger.svg" alt="Menu" />
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"></path>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18"></path>
          </svg>
        </div>
        <div id="btn" class="buttons">
          <a href="https://github.com/hiteshraj786/Spotify-Clone" target="_blank" style="text-decoration: none;">
            <button class="signupbtn">Source Code</button>
          </a>
          <a href="https://github.com/hiteshraj007" target="_blank" style="text-decoration: none;">
            <button class="loginbtn">My GitHub</button>
          </a>
        </div>
      </div>
      <div class="spotifyPlaylist p-1">
        <h1>Spotify Playlists</h1>
        <div class="cardContainer">
        </div>

        <div class="playBar">


          <div class="seekBar">
            <div class="circle">

            </div>

          </div>
          <div class="aboveBar">

            <div class="songInfo"></div>

            <div class="songButton">

              <img id="previous" class="invert opacity-70" src="img/previous.svg" alt="Previous Song" />
              <img id="play" src="img/playsong.svg" alt="Play Song" />
              <img id="next" class="invert opacity-70" src="img/nextsong.svg" alt="Next Song" />
            </div>

            <div class="songTimeVolume">
              <div class="songTime">

              </div>
              <div class="volume">
                <img class="invert" src="img/volume.svg" alt="Volume" />
                <div class="range">
                  <input type="range" id="volumeBar" min="0" max="100" value="50">

                </div>
              </div>

            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" style="
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1DB954;
    color: white;
    padding: 14px 28px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 15px;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
    box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
    white-space: nowrap;
  ">✅ App Installed Successfully!</div>

  <script src="js/script.js"></script>
  <script>
    // PWA: Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch((err) => console.log('SW registration failed:', err));
    }

    // PWA: Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
    });

    // Toast function
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(20px)';
      }, 3000);
    }

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Install outcome:', outcome);
        if (outcome === 'accepted') {
          showToast('✅ App Installed Successfully!');
        }
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      showToast('✅ HitMelody App Installed!');
      console.log('App installed successfully!');
    });
  </script>
</body>

</html>
